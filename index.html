<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPW T.M.T</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1f2933;
    --sub: #616e7c;
    --line: #dde3ea;
    --primary: #1f6feb;
    --primary-soft: #e7f0fe;
    --new: #e5252a;
    --new-soft: #fdecec;
    --radius: 12px;
    /* 태그 그룹 색상 */
    --g-process: #1f6feb;   --g-process-soft: #e7f0fe;
    --g-contam:  #8e44ad;   --g-contam-soft:  #f3e9f8;
    --g-oper:    #2e7d32;   --g-oper-soft:    #e8f5e9;
    --g-reclaim: #c2410c;   --g-reclaim-soft: #fdeee6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

  /* 헤더 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; }
  .head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .new-total {
    background: var(--new); color: #fff; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; font-size: 14px; white-space: nowrap;
  }

  /* 번역 안내 */
  .tr-bar {
    font-size: 13px; color: var(--sub); background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; white-space: nowrap;
  }
  .tr-bar.on { color: #2e7d32; border-color: #b7dfb9; background: #f1faf1; }
  .tr-bar button {
    border: none; background: var(--primary); color: #fff; border-radius: 999px;
    padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: 4px;
  }
  .tr-notice {
    background: #fffbea; border: 1px solid #f3e1a0; color: #7a5b00;
    border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px;
  }
  .tr-notice button { border: none; background: none; color: #7a5b00; font-weight: 700; cursor: pointer; float: right; }

  /* 검색 패널 */
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .label { font-weight: 600; color: var(--sub); min-width: 56px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary-soft); color: var(--primary);
    padding: 6px 10px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .chip button {
    border: none; background: none; color: var(--primary);
    font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  input[type="text"], input[type="number"], select {
    font-size: 15px; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text);
  }
  #kwInput { flex: 1; min-width: 160px; }
  input[type="number"] { width: 90px; }

  .btn {
    font-size: 15px; padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text); font-weight: 600;
  }
  a.btn { text-decoration: none; display: inline-block; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; background: #fff; padding: 9px 14px; font-size: 14px;
    cursor: pointer; font-weight: 600; color: var(--sub);
  }
  .seg button.on { background: var(--text); color: #fff; }

  /* 스위치 (UPW 관련성 필터) */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-weight: 600; font-size: 14px; }
  .switch input { display: none; }
  .switch .track {
    width: 42px; height: 24px; border-radius: 999px; background: #c5ccd6; position: relative; transition: .2s;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: .2s;
  }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track::after { left: 21px; }
  .hint { color: var(--sub); font-size: 13px; }

  /* 탭 */
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
  .tab {
    border: 1px solid var(--line); background: var(--card);
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--sub); white-space: nowrap;
  }
  .tab.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .tab .cnt { opacity: .8; margin-left: 4px; font-weight: 500; }

  /* 태그 필터 바 */
  .tagbar {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .tagbar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tagbar-head b { font-size: 14px; }
  .tagbar-head button { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 600; }
  .tag-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
  .tag-group .gname { font-size: 12px; font-weight: 700; color: var(--sub); min-width: 64px; }
  .tagf {
    border: 1px solid transparent; border-radius: 999px; padding: 4px 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tagf .n { opacity: .7; margin-left: 3px; font-weight: 500; }
  .tagf.off { opacity: .45; }
  .tagbar.collapsed .tag-group { display: none; }

  .t-process { background: var(--g-process-soft); color: var(--g-process); }
  .t-contam  { background: var(--g-contam-soft);  color: var(--g-contam); }
  .t-oper    { background: var(--g-oper-soft);    color: var(--g-oper); }
  .t-reclaim { background: var(--g-reclaim-soft); color: var(--g-reclaim); }
  .tagf.sel.t-process { background: var(--g-process); color: #fff; }
  .tagf.sel.t-contam  { background: var(--g-contam);  color: #fff; }
  .tagf.sel.t-oper    { background: var(--g-oper);    color: #fff; }
  .tagf.sel.t-reclaim { background: var(--g-reclaim); color: #fff; }

  .status { color: var(--sub); font-size: 14px; margin: 0 4px 12px; min-height: 20px; }
  .status .ok { color: #2e7d32; font-weight: 600; }
  .status .err { color: var(--new); font-weight: 600; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
    border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 카드 목록 */
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-left: 5px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card.is-new { border-left-color: var(--new); background: linear-gradient(90deg, var(--new-soft), #fff 40%); }
  .card.low { opacity: .55; }
  .low-label { font-size: 12px; color: var(--sub); background: #eef1f4; padding: 1px 7px; border-radius: 5px; align-self: flex-start; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; }
  .badge-new {
    background: var(--new); color: #fff; font-size: 12px; font-weight: 800;
    padding: 2px 8px; border-radius: 6px; flex-shrink: 0; margin-top: 2px;
  }
  .card h3 { font-size: 16px; margin: 0; flex: 1; line-height: 1.4; }
  .card h3.pending { color: var(--sub); }
  .date { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .orig-title { font-size: 13px; color: var(--sub); margin: -4px 0 0; font-style: italic; }
  .meta { color: var(--sub); font-size: 13px; }
  .src {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 1px 7px; border-radius: 5px; margin-right: 6px;
  }
  .src.ss { background: #e8f5e9; color: #2e7d32; }
  .src.sd { background: #fff3e0; color: #e65100; }
  .src.both { background: #ede7f6; color: #5e35b1; }
  .abstract {
    font-size: 14px; color: #3e4c59; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .abstract.open { -webkit-line-clamp: unset; display: block; }
  .abs-tools { display: flex; gap: 14px; }
  .more { border: none; background: none; color: var(--primary); cursor: pointer; padding: 0; font-size: 13px; align-self: flex-start; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .actions .btn { padding: 10px 14px; }

  .empty { text-align: center; color: var(--sub); padding: 40px 0; grid-column: 1 / -1; }

  /* 페이지 이동 */
  .pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }
  .pager button {
    min-width: 40px; height: 40px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text); padding: 0 10px;
  }
  .pager button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager .dots { color: var(--sub); padding: 0 4px; }
  .pager-info { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 24px; }

  /* 번역 토글 (작은 스위치) */
  .switch.sm .track { width: 34px; height: 20px; }
  .switch.sm .track::after { width: 14px; height: 14px; }
  .switch.sm input:checked + .track::after { left: 17px; }
  .switch.sm { font-size: 13px; gap: 6px; }
  .tr-bar.on .switch input:checked + .track { background: #2e7d32; }

  /* NEW 읽음 처리 버튼 */
  .read-all {
    border: 1px solid var(--new); color: var(--new); background: #fff; border-radius: 999px;
    padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  /* 즐겨찾기 별 */
  .star {
    border: none; background: none; cursor: pointer; font-size: 24px; line-height: 1;
    color: #c5ccd6; padding: 0 0 0 4px; flex-shrink: 0; margin-top: -2px;
  }
  .star.on { color: #f5b301; }
  .star:hover { transform: scale(1.12); }

  /* 메모 */
  .memo-view {
    background: #fffbea; border: 1px solid #f3e1a0; border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: #5c4600; white-space: pre-wrap;
  }
  .memo-edit { display: none; flex-direction: column; gap: 6px; }
  .memo-edit.open { display: flex; }
  .memo-edit textarea {
    font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #f3e1a0;
    border-radius: 8px; min-height: 64px; resize: vertical; background: #fffdf3;
  }
  .memo-edit .row { margin: 0; justify-content: flex-end; }

  /* 즐겨찾기 탭 상단 바 */
  .favbar {
    display: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .favbar.show { display: flex; }
  .favbar input[type="text"] { flex: 1; min-width: 180px; }

  /* 기술동향 대시보드 */
  .dash {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .dash-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dash-head b { font-size: 14px; }
  .dash-head button { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 600; }
  .dash-sum { font-size: 13px; color: var(--sub); }
  .dash-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 12px; }
  .dash.collapsed .dash-body { display: none; }
  .chart-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  .hbar { display: grid; grid-template-columns: 96px 1fr 32px; align-items: center; gap: 8px;
    padding: 3px 4px; border-radius: 6px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font: inherit; }
  .hbar:hover { background: #f1f4f8; }
  .hbar.sel { background: #e7f0fe; }
  .hbar .nm { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .track2 { height: 12px; }
  .hbar .fill { height: 12px; border-radius: 0 4px 4px 0; min-width: 3px; }
  .hbar .v { font-size: 12px; color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }

  .cols { display: flex; align-items: flex-end; gap: 6px; height: 150px; border-bottom: 1px solid var(--line); padding: 0 2px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .col .bar { width: 100%; max-width: 34px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col .cv { font-size: 11px; color: var(--sub); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .col:hover .bar { background: #1858c4; }
  .col-labels { display: flex; gap: 6px; padding: 4px 2px 0; }
  .col-labels span { flex: 1; font-size: 10.5px; color: var(--sub); text-align: center; min-width: 0; white-space: nowrap; overflow: hidden; }
  .dash-empty { color: var(--sub); font-size: 13px; padding: 12px 0; }

  /* 태블릿 세로 · 모바일: 1열 */
  @media (max-width: 860px) {
    .list { grid-template-columns: 1fr; }
    header h1 { font-size: 18px; }
    .btn, .tab, .seg button { padding-top: 11px; padding-bottom: 11px; }
    .tagf { padding: 7px 12px; font-size: 14px; }
    .pager button { min-width: 46px; height: 46px; }
    .dash-body { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🔬 UPW T.M.T</h1>
    <div class="head-right">
      <span class="tr-bar" id="trBar">🇰🇷 번역 확인 중...</span>
      <span class="new-total" id="newTotal">🔴 NEW 0</span>
      <button class="read-all" id="readAll" title="지금 보이는 NEW 표시를 모두 지웁니다">모두 읽음 처리</button>
    </div>
  </header>

  <div class="tr-notice" id="trNotice" style="display:none"></div>

  <!-- 검색 패널 -->
  <section class="panel">
    <div class="row">
      <span class="label">키워드</span>
      <div id="chips" class="row" style="margin:0"></div>
    </div>
    <div class="row">
      <input type="text" id="kwInput" placeholder="키워드 입력 후 Enter (예: boron removal)">
      <button class="btn" id="kwAdd">+ 추가</button>
    </div>
    <div class="row">
      <span class="label">기간</span>
      <select id="period">
        <option value="0.5">최근 6개월</option>
        <option value="1">최근 1년</option>
        <option value="2" selected>최근 2년</option>
        <option value="3">최근 3년</option>
        <option value="custom">직접 입력</option>
      </select>
      <span id="customBox" style="display:none">
        <input type="number" id="fromYear" min="1990" max="2100"> ~
        <input type="number" id="toYear" min="1990" max="2100">
      </span>
    </div>
    <div class="row">
      <span class="label">정렬</span>
      <div class="seg" id="sortSeg">
        <button data-sort="date" class="on">최신순</button>
        <button data-sort="cite">인용수순</button>
      </div>
    </div>
    <div class="row">
      <span class="label">필터</span>
      <label class="switch">
        <input type="checkbox" id="upwOnly">
        <span class="track"></span>
        UPW 관련 논문만 보기
      </label>
      <span class="hint" id="upwHint"></span>
      <label class="switch" id="appSwitch" style="display:none">
        <input type="checkbox" id="readInApp">
        <span class="track"></span>
        📱 바로읽기를 Claude 앱으로
      </label>
      <span style="flex:1"></span>
      <button class="btn primary" id="searchBtn">🔍 검색</button>
    </div>
  </section>

  <!-- 탭 -->
  <nav class="tabs" id="tabs"></nav>

  <!-- 기술동향 대시보드 -->
  <section class="dash" id="dash" translate="no">
    <div class="dash-head">
      <b>📊 기술동향 대시보드 <span class="dash-sum" id="dashSum"></span></b>
      <button id="dashToggle">접기 ▴</button>
    </div>
    <div class="dash-body" id="dashBody"></div>
  </section>

  <!-- 태그 필터 -->
  <section class="tagbar" id="tagbar" translate="no">
    <div class="tagbar-head">
      <b>🏷 기술동향 태그 <span class="hint" id="tagSelInfo"></span></b>
      <span>
        <button id="tagClear">선택 해제</button>
        <button id="tagToggle">접기 ▴</button>
      </span>
    </div>
    <div id="tagGroups"></div>
  </section>

  <!-- 즐겨찾기 탭 전용 바 -->
  <section class="favbar" id="favbar">
    <input type="text" id="favSearch" placeholder="🔎 즐겨찾기에서 제목·메모 검색">
    <button class="btn" id="backupExport">💾 백업 내보내기</button>
    <button class="btn" id="backupImport">📂 백업 불러오기</button>
    <input type="file" id="backupFile" accept=".json,application/json" style="display:none">
  </section>

  <div class="status" id="status"></div>

  <!-- 논문 목록 -->
  <main class="list" id="list"></main>
  <nav class="pager" id="pager"></nav>
  <div class="pager-info" id="pagerInfo"></div>

</div>

<script>
/* =========================================================
   반도체용 초순수 최신논문 수집기 — Step 3~6 (대시보드·/paper 연계 포함, 프리셋 제외)
   (번역 B+A·토글, 태그, UPW 필터, 페이지, NEW, 즐겨찾기·메모, 백업)
   ========================================================= */

const STORE_KEY = 'upwCollector.settings';
const TR_CACHE_KEY = 'upwCollector.titleKo';
const SEEN_KEY = 'upwCollector.seen';     // 이미 본 논문 기록 (NEW 판단용)
const FAV_KEY = 'upwCollector.favs';      // 즐겨찾기 + 메모
const PAGE_SIZE = 5;
const MAX_PER_SOURCE = 100;
const ELSEVIER_ID = 'P4310320990';

const DEFAULT_SETTINGS = {
  keywords: ['ultrapure water', 'semiconductor'],
  period: '2',
  fromYear: null,
  toYear: null,
  sort: 'date',
  upwOnly: true,
  tagbarOpen: true,
  hideTrNotice: false,
  trEnabled: true,
  dashOpen: true,
  readInApp: true      // 안드로이드: 바로읽기를 Claude 앱으로 열기
};

const TABS = [
  { id: 'all', name: '전체' },
  { id: 'ss',  name: 'Semantic Scholar' },
  { id: 'sd',  name: 'ScienceDirect' },
  { id: 'fav', name: '⭐ 즐겨찾기' }
];

/* ---------- 기술동향 태그 사전 (4개 그룹, 32개 태그) ---------- */
const TAG_GROUPS = [
  { id: 'process', name: '공정', cls: 't-process', tags: [
    { name: 'RO',        terms: ['Reverse osmosis', 'RO', 'Two-pass RO', 'Double-pass RO'] },
    { name: 'EDI',       terms: ['Electrodeionization', 'EDI', 'CEDI'] },
    { name: '이온교환',   terms: ['Ion exchange', 'IX', 'Mixed-bed ion exchange', 'MBIX'] },
    { name: 'UF',        terms: ['Ultrafiltration', 'UF'] },
    { name: 'MF·정밀여과', terms: ['Microfiltration', 'MF', 'Sub-micron filtration', 'Point-of-use filter', 'POU filter'] },

/* UPW 관련성 판단 용어 */
const UPW_TERMS = ['ultrapure water', 'ultra-pure water', 'ultra pure water', 'UPW', 'high-purity water', 'high purity water', '초순수'];

/* ---------- 태그 매칭기 만들기 ---------- */
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function isAbbrev(t) { return /^[A-Z0-9₂]{2,6}s?$/.test(t) && /[A-Z]/.test(t); }

/* 약어(RO, DO 등): 대문자 + 단어 단위 정확 일치 / 일반 용어: 대소문자 무시, 하이픈=공백 */
function makeMatcher(term) {
  if (isAbbrev(term)) {
    return { abbr: true, re: new RegExp(`(^|[^A-Za-z0-9])${escRe(term)}s?(?![A-Za-z0-9])`) };
  }
  const norm = term.toLowerCase().replace(/-/g, ' ');
  return { abbr: false, re: new RegExp(`(^|[^a-z0-9])${escRe(norm)}(?![a-z0-9])`) };
}

const TAG_INDEX = [];   // { key, name, group, cls, matchers }
TAG_GROUPS.forEach(g => g.tags.forEach(t => {
  TAG_INDEX.push({ key: `${g.id}:${t.name}`, name: t.name, group: g.id, cls: g.cls, matchers: t.terms.map(makeMatcher) });
}));
const UPW_MATCHERS = UPW_TERMS.map(makeMatcher);

function textMatches(matchers, raw, low) {
  return matchers.some(m => m.abbr ? m.re.test(raw) : m.re.test(low));
}
function analyzePaper(p) {
  const raw = `${p.title} ${p.abstract}`;
  const low = raw.toLowerCase().replace(/-/g, ' ');
  p.tags = TAG_INDEX.filter(t => textMatches(t.matchers, raw, low)).map(t => t.key);
  p.upw = textMatches(UPW_MATCHERS, raw, low);
  return p;
}

/* ---------- 논문 고유키 (DOI 우선) ---------- */
function paperKey(p) { return p.doi ? 'doi:' + p.doi : p.id; }

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.warn('저장 실패', key, e); return false; }
}

/* ---------- NEW 판단 ---------- */
function applyNewFlags() {
  const papers = [...state.all, ...state.ss, ...state.sd];
  if (state.seen === null) {
    // 첫 방문: 지금 결과를 기준선으로 저장 → 다음 방문부터 새 논문에 NEW
    state.seen = {};
    papers.forEach(p => { state.seen[paperKey(p)] = 1; });
    saveJson(SEEN_KEY, state.seen);
    state.firstVisit = true;
  }
  papers.forEach(p => { p.isNew = !state.seen[paperKey(p)]; });
}
function markSeen(keys) {
  keys.forEach(k => { state.seen[k] = 1; });
  const all = Object.keys(state.seen);
  if (all.length > 20000) all.slice(0, all.length - 20000).forEach(k => delete state.seen[k]);
  saveJson(SEEN_KEY, state.seen);
  [...state.all, ...state.ss, ...state.sd].forEach(p => { if (keys.includes(paperKey(p))) p.isNew = false; });
}

/* ---------- 즐겨찾기 / 메모 ---------- */
function isFav(p) { return !!state.favs[paperKey(p)]; }
function snapshot(p) {
  const { id, sources, title, authors, venue, date, citations, abstract, doi, pdfUrl, landingUrl } = p;
  return { id, sources, title, authors, venue, date, citations, abstract, doi, pdfUrl, landingUrl };
}
function toggleFav(p) {
  const k = paperKey(p);
  if (state.favs[k]) {
    if (state.favs[k].memo && !confirm('메모가 있는 논문입니다. 즐겨찾기에서 빼면 메모도 함께 삭제됩니다. 계속할까요?')) return;
    delete state.favs[k];
  } else {
    state.favs[k] = { paper: snapshot(p), memo: '', addedAt: new Date().toISOString() };
  }
  saveJson(FAV_KEY, state.favs);
}
function saveMemo(p, text) {
  const k = paperKey(p);
  if (!state.favs[k]) state.favs[k] = { paper: snapshot(p), memo: '', addedAt: new Date().toISOString() };
  state.favs[k].memo = text.trim();
  saveJson(FAV_KEY, state.favs);
}
function favPapers() {
  const q = state.favQuery.trim().toLowerCase();
  return Object.values(state.favs)
    .map(f => {
      const live = state.all.find(p => paperKey(p) === paperKey(f.paper));
      const p = analyzePaper({ ...f.paper, ...(live ? { citations: live.citations, pdfUrl: live.pdfUrl || f.paper.pdfUrl } : {}) });
      p.isNew = false;
      p.memo = f.memo;
      p.addedAt = f.addedAt;
      p.upw = true; // 즐겨찾기는 관련성 필터와 무관하게 항상 표시
      return p;
    })
    .filter(p => !q || p.title.toLowerCase().includes(q) || (p.memo || '').toLowerCase().includes(q)
      || (state.tr.cache[p.title] || '').toLowerCase().includes(q));
}

/* ---------- 백업 내보내기 / 불러오기 ---------- */
function exportBackup() {
  const data = { app: 'upw-collector', version: 1, exportedAt: new Date().toISOString(), favs: state.favs };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `upw-즐겨찾기-백업-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || data.app !== 'upw-collector' || typeof data.favs !== 'object') throw new Error('형식 불일치');
      let added = 0, merged = 0;
      for (const [k, f] of Object.entries(data.favs)) {
        if (!f || !f.paper) continue;
        if (state.favs[k]) {
          // 이미 있으면 메모만 합침 (서로 다르면 둘 다 보존)
          const a = state.favs[k].memo || '', b = f.memo || '';
          if (b && a !== b) state.favs[k].memo = a ? `${a}\n---\n${b}` : b;
          merged++;
        } else { state.favs[k] = f; added++; }
      }
      saveJson(FAV_KEY, state.favs);
      alert(`백업을 불러왔습니다. 새로 추가 ${added}건, 기존과 합침 ${merged}건`);
      renderAll();
    } catch (e) {
      alert('백업 파일을 읽지 못했습니다. 이 수집기에서 내보낸 .json 파일인지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
}

/* ---------- 유틸 ---------- */
const $ = (sel) => document.querySelector(sel);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function getDateRange() {
  const s = state.settings;
  const today = new Date();
  if (s.period === 'custom') {
    let from = s.fromYear || today.getFullYear() - 2;
    let to = s.toYear || today.getFullYear();
    if (from > to) [from, to] = [to, from];
    return { from: `${from}-01-01`, to: `${to}-12-31` };
  }
  const months = Math.round(parseFloat(s.period) * 12);
  const start = new Date(today);
  start.setMonth(start.getMonth() - months);
  return { from: start.toISOString().slice(0, 10), to: today.toISOString().slice(0, 10) };
}
function authorText(names) {
  const list = names.filter(Boolean);
  if (list.length === 0) return '저자 정보 없음';
  return list.length > 3 ? `${list.slice(0, 3).join(', ')} 외 ${list.length - 3}명` : list.join(', ');
}
function normDoi(doi) {
  if (!doi) return '';
  return String(doi).toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, '').trim();
}

async function fetchJson(url, label) {
  for (let attempt = 1; attempt <= 3; attempt++) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      if (attempt === 3) throw new Error(`${label}: 네트워크 연결 실패 (${e.message})`);
      await sleep(1500 * attempt);
      continue;
    }
    if (res.ok) return res.json();
    if (res.status === 429 && attempt < 3) {
      $('#status').innerHTML = `<span class="spinner"></span>${label} 요청이 몰려 잠시 대기 후 재시도 중... (${attempt}/3)`;
      await sleep(2000 * attempt);
      continue;
    }
    let msg = '';
    try { msg = (await res.text()).slice(0, 150); } catch (e) {}
    throw new Error(`${label}: HTTP ${res.status} ${msg}`);
  }
}

/* ---------- 수집기 1: Semantic Scholar ---------- */
function buildSSQuery(keywords) {
  return keywords.map(k => (/\s/.test(k) ? `"${k}"` : k)).join(' + ');
}
async function fetchSemanticScholar(keywords, range) {
  const params = new URLSearchParams({
    query: buildSSQuery(keywords),
    fields: 'title,abstract,authors,venue,journal,publicationDate,year,citationCount,externalIds,openAccessPdf,url',
    sort: 'publicationDate:desc',
    publicationDateOrYear: `${range.from}:${range.to}`
  });
  const json = await fetchJson(`https://api.semanticscholar.org/graph/v1/paper/search/bulk?${params}`, 'Semantic Scholar');
  return (json.data || []).slice(0, MAX_PER_SOURCE).map(p => {
    const doi = normDoi(p.externalIds && p.externalIds.DOI);
    return {
      id: 'ss:' + p.paperId,
      sources: ['ss'],
      title: p.title || '(제목 없음)',
      authors: authorText((p.authors || []).map(a => a.name)),
      venue: p.venue || (p.journal && p.journal.name) || '저널 정보 없음',
      date: p.publicationDate || (p.year ? String(p.year) : ''),
      citations: p.citationCount || 0,
      abstract: p.abstract || '',
      doi,
      pdfUrl: p.openAccessPdf && p.openAccessPdf.url ? p.openAccessPdf.url : '',
      landingUrl: doi ? `https://doi.org/${doi}` : (p.url || '')
    };
  });
}

/* ---------- 수집기 2: OpenAlex (ScienceDirect/Elsevier) ---------- */
function buildOAQuery(keywords) {
  return keywords.map(k => (/\s/.test(k) ? `"${k}"` : k)).join(' AND ');
}
function rebuildAbstract(inv) {
  if (!inv) return '';
  const words = [];
  for (const [word, positions] of Object.entries(inv)) positions.forEach(pos => { words[pos] = word; });
  return words.filter(w => w !== undefined).join(' ');
}
async function fetchScienceDirect(keywords, range) {
  const params = new URLSearchParams({
    search: buildOAQuery(keywords),
    filter: `from_publication_date:${range.from},to_publication_date:${range.to},primary_location.source.host_organization:${ELSEVIER_ID}`,
    sort: 'publication_date:desc',
    'per-page': String(MAX_PER_SOURCE),
    select: 'id,doi,display_name,publication_date,cited_by_count,authorships,primary_location,best_oa_location,abstract_inverted_index'
  });
  const json = await fetchJson(`https://api.openalex.org/works?${params}`, 'ScienceDirect(OpenAlex)');
  return (json.results || []).map(w => {
    const doi = normDoi(w.doi);
    const oa = w.best_oa_location || {};
    const src = (w.primary_location && w.primary_location.source) || {};
    return {
      id: 'sd:' + String(w.id).split('/').pop(),
      sources: ['sd'],
      title: w.display_name || '(제목 없음)',
      authors: authorText((w.authorships || []).map(a => a.author && a.author.display_name)),
      venue: src.display_name || '저널 정보 없음',
      date: w.publication_date || '',
      citations: w.cited_by_count || 0,
      abstract: rebuildAbstract(w.abstract_inverted_index),
      doi,
      pdfUrl: oa.pdf_url || '',
      landingUrl: doi ? `https://doi.org/${doi}` : ((w.primary_location && w.primary_location.landing_page_url) || '')
    };
  });
}

function mergeSources(ss, sd) {
  const map = new Map();
  const add = (p) => {
    const key = p.doi ? 'doi:' + p.doi : p.id;
    const prev = map.get(key);
    if (!prev) { map.set(key, { ...p, sources: [...p.sources] }); return; }
    prev.sources = [...new Set([...prev.sources, ...p.sources])];
    prev.citations = Math.max(prev.citations, p.citations);
    if (!prev.abstract && p.abstract) prev.abstract = p.abstract;
    if (!prev.pdfUrl && p.pdfUrl) prev.pdfUrl = p.pdfUrl;
    if (String(p.date).length > String(prev.date).length) prev.date = p.date;
  };
  sd.forEach(add);
  ss.forEach(add);
  return [...map.values()].map(analyzePaper);
}

/* ---------- 검색 실행 ---------- */
async function runSearch() {
  if (state.loading) return;
  const kws = state.settings.keywords;
  if (kws.length === 0) {
    $('#status').innerHTML = '<span class="err">⚠️ 키워드를 1개 이상 추가해 주세요.</span>';
    return;
  }
  const range = getDateRange();
  state.loading = true;
  $('#searchBtn').disabled = true;
  $('#status').innerHTML = `<span class="spinner"></span>검색 중... [${esc(kws.join(', '))}] ${range.from} ~ ${range.to}`;
  $('#list').innerHTML = '';
  $('#pager').innerHTML = '';
  $('#pagerInfo').textContent = '';
  renderDash();

  const [ssRes, sdRes] = await Promise.allSettled([
    fetchSemanticScholar(kws, range),
    fetchScienceDirect(kws, range)
  ]);

  const msgs = [];
  if (ssRes.status === 'fulfilled') {
    state.ss = ssRes.value.map(analyzePaper);
    msgs.push(`<span class="ok">Semantic Scholar ${state.ss.length}건 ✅</span>`);
  } else {
    state.ss = [];
    msgs.push(`<span class="err">Semantic Scholar 실패 ❌ (${esc(ssRes.reason.message)})</span>`);
    console.error(ssRes.reason);
  }
  if (sdRes.status === 'fulfilled') {
    state.sd = sdRes.value.map(analyzePaper);
    msgs.push(`<span class="ok">ScienceDirect ${state.sd.length}건 ✅</span>`);
  } else {
    state.sd = [];
    msgs.push(`<span class="err">ScienceDirect 실패 ❌ (${esc(sdRes.reason.message)})</span>`);
    console.error(sdRes.reason);
  }
  state.all = mergeSources(state.ss, state.sd);
  applyNewFlags();

  state.loading = false;
  state.searched = true;
  state.page = 1;
  $('#searchBtn').disabled = false;
  const dup = state.all.filter(p => p.sources.length > 1).length;
  $('#status').innerHTML = `${msgs.join(' · ')} — 기간 ${range.from} ~ ${range.to}`
    + (dup ? ` · 🔁 두 출처에 모두 있는 논문 ${dup}건은 [전체]에서 1건으로 합침` : '')
    + (state.firstVisit ? ' · <b>첫 방문이라 지금 목록을 기준으로 저장했습니다. 다음부터 새로 등록된 논문에 🔴NEW가 붙습니다.</b>' : '');
  state.firstVisit = false;
  renderAll();
}

/* =========================================================
   번역 (B: Chrome 내장 번역 엔진 → 안 되면 A: 브라우저 번역 안내)
   ========================================================= */
async function initTranslator() {
  if (!('Translator' in self)) { setTrMode('fallback'); return; }
  try {
    const avail = await Translator.availability({ sourceLanguage: 'en', targetLanguage: 'ko' });
    if (avail === 'unavailable') { setTrMode('fallback'); return; }
    if (avail === 'available') {
      await createTranslator();
    } else {
      setTrMode('needClick');   // 번역 모델 다운로드가 필요 → 사용자가 한 번 눌러야 시작 가능
    }
  } catch (e) {
    console.warn('번역 엔진 확인 실패', e);
    setTrMode('fallback');
  }
}

async function createTranslator() {
  try {
    setTrMode('downloading', 0);
    state.tr.translator = await Translator.create({
      sourceLanguage: 'en',
      targetLanguage: 'ko',
      monitor(m) {
        m.addEventListener('downloadprogress', e => setTrMode('downloading', Math.round((e.loaded || 0) * 100)));
      }
    });
    setTrMode('on');
    translateVisible();
  } catch (e) {
    console.warn('번역 엔진 생성 실패', e);
    setTrMode(state.tr.mode === 'downloading' ? 'needClick' : 'fallback');
  }
}

function setTrMode(mode, pct) {
  state.tr.mode = mode;
  const bar = $('#trBar');
  const notice = $('#trNotice');
  bar.className = 'tr-bar';
  notice.style.display = 'none';
  if (mode === 'on') {
    const en = state.settings.trEnabled;
    if (en) bar.classList.add('on');
    bar.innerHTML = `<label class="switch sm">🇰🇷 제목 자동 번역
      <input type="checkbox" id="trToggle" ${en ? 'checked' : ''}><span class="track"></span>
      <span>${en ? '켜짐' : '꺼짐'}</span></label>`;
    $('#trToggle').onchange = (e) => {
      state.settings.trEnabled = e.target.checked;
      saveSettings();
      setTrMode('on');
    };
  } else if (mode === 'downloading') {
    bar.textContent = `🇰🇷 번역 모델 준비 중... ${pct || 0}%`;
  } else if (mode === 'needClick') {
    bar.innerHTML = '🇰🇷 제목 자동 번역<button id="trStart">켜기</button>';
    $('#trStart').onclick = () => createTranslator();
  } else if (mode === 'fallback') {
    bar.textContent = '🇰🇷 브라우저 번역 사용';
    if (!state.settings.hideTrNotice) {
      notice.innerHTML = `<button id="trHide" title="다시 보지 않기">✕</button>
        💡 이 브라우저는 자동 번역 엔진을 지원하지 않습니다. 제목을 한국어로 보려면
        <b>갤럭시탭·안드로이드 Chrome: 오른쪽 위 ⋮ 메뉴 → 번역</b>,
        <b>PC Chrome: 화면 빈 곳 우클릭 → 한국어로 번역</b>을 눌러 주세요. 영어 원제는 그대로 남습니다.`;
      notice.style.display = 'block';
      $('#trHide').onclick = () => { state.settings.hideTrNotice = true; saveSettings(); notice.style.display = 'none'; };
    }
  } else {
    bar.textContent = '🇰🇷 번역 확인 중...';
  }
  if (!state.loading) renderList();
}

/* 현재 페이지에 보이는 제목만 번역 (이미 번역한 것은 저장본 사용) */
async function translateVisible() {
  if (state.tr.mode !== 'on' || !state.settings.trEnabled || !state.tr.translator || state.tr.busy) return;
  state.tr.busy = true;
  try {
    let changed = false;
    for (const p of pageSlice()) {
      if (state.tr.cache[p.title]) continue;
      try {
        state.tr.cache[p.title] = await state.tr.translator.translate(p.title);
        changed = true;
        const h = document.querySelector(`h3[data-pid="${CSS.escape(p.id)}"]`);
        if (h) { h.textContent = state.tr.cache[p.title]; h.classList.remove('pending'); }
      } catch (e) { console.warn('번역 실패', p.title, e); }
    }
    if (changed) saveTrCache();
  } finally {
    state.tr.busy = false;
  }
  // 번역 중 페이지가 바뀌었으면 새 페이지도 이어서 번역
  if (state.settings.trEnabled && pageSlice().some(p => !state.tr.cache[p.title])) translateVisible();
}

   화면 그리기

/* ---------- 기술동향 대시보드 ---------- */
function periodKey(date, byYear) {
  const y = String(date).slice(0, 4);
  if (byYear) return y;
  const m = Number(String(date).slice(5, 7));
  return m ? `${y} Q${Math.ceil(m / 3)}` : y;
}
function renderDash() {
  const dash = $('#dash');
  dash.classList.toggle('collapsed', !state.settings.dashOpen);
  $('#dashToggle').textContent = state.settings.dashOpen ? '접기 ▴' : '펼치기 ▾';

  const base = upwFiltered(sourceList(state.tab));
  if (state.loading || !base.length) {
    $('#dashSum').textContent = '';
    $('#dashBody').innerHTML = `<div class="dash-empty">${state.loading ? '불러오는 중...' : '표시할 데이터가 없습니다.'}</div>`;
    return;
  }

  /* 1) 태그별 논문 수 (많은 순, 최대 12개) */
  const counts = {};
  base.forEach(p => p.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const tagRows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const maxT = tagRows.length ? tagRows[0][1] : 1;
  const colorOf = { process: 'var(--g-process)', contam: 'var(--g-contam)', oper: 'var(--g-oper)', reclaim: 'var(--g-reclaim)' };

  const tagChart = tagRows.length ? tagRows.map(([key, n]) => {
    const t = tagMeta(key);
    const pct = Math.max(2, Math.round(n / maxT * 100));
    return `<button class="hbar ${state.selTags.has(key) ? 'sel' : ''}" data-key="${esc(key)}" title="#${esc(t.name)}: ${n}건 · 누르면 이 태그로 필터">
      <span class="nm">#${esc(t.name)}</span>
      <span class="track2"><span class="fill" style="display:block;width:${pct}%;background:${colorOf[t.group]}"></span></span>
      <span class="v">${n}</span>
    </button>`;
  }).join('') : '<div class="dash-empty">태그가 붙은 논문이 없습니다.</div>';

  /* 2) 기간별 논문 수 (4년 이하면 분기, 넘으면 연도) */
  const dates = base.map(p => p.date).filter(d => /^\d{4}/.test(d)).sort();
  const span = dates.length ? Number(dates[dates.length - 1].slice(0, 4)) - Number(dates[0].slice(0, 4)) : 0;
  const byYear = span > 4;
  const per = {};
  dates.forEach(d => { const k = periodKey(d, byYear); per[k] = (per[k] || 0) + 1; });
  // 빈 분기도 0으로 채워서 추이가 끊기지 않게
  const keys = [];
  if (dates.length) {
    let y = Number(dates[0].slice(0, 4)), q = byYear ? 0 : Math.max(1, Math.ceil(Number(dates[0].slice(5, 7) || 1) / 3));
    const endY = Number(dates[dates.length - 1].slice(0, 4));
    const endQ = byYear ? 0 : Math.max(1, Math.ceil(Number(dates[dates.length - 1].slice(5, 7) || 1) / 3));
    while (y < endY || (y === endY && q <= endQ)) {
      keys.push(byYear ? String(y) : `${y} Q${q}`);
      if (byYear) y++; else { q++; if (q > 4) { q = 1; y++; } }
      if (keys.length > 60) break;
    }
  }
  const maxP = Math.max(1, ...keys.map(k => per[k] || 0));
  const trendChart = keys.length ? `
    <div class="cols">${keys.map(k => {
      const n = per[k] || 0;
      return `<div class="col" title="${esc(k)}: ${n}건"><span class="cv">${n || ''}</span><div class="bar" style="height:${Math.round(n / maxP * 100)}%"></div></div>`;
    }).join('')}</div>
    <div class="col-labels">${keys.map(k => `<span>${esc(byYear ? k : k.replace(/^\d{2}/, '\''))}</span>`).join('')}</div>`
    : '<div class="dash-empty">날짜 정보가 없습니다.</div>';

  const top = tagRows[0] ? `#${tagMeta(tagRows[0][0]).name} ${tagRows[0][1]}건` : '-';
  $('#dashSum').textContent = `· ${TABS.find(t => t.id === state.tab).name} ${base.length}건 · 최다 태그 ${top}`;

  $('#dashBody').innerHTML = `
    <div>
      <div class="chart-title">태그별 논문 수 <span class="hint">(막대를 누르면 필터)</span></div>
      <div class="legend">${TAG_GROUPS.map(g => `<span><i style="background:${colorOf[g.id]}"></i>${g.name}</span>`).join('')}</div>
      ${tagChart}
    </div>
    <div>
      <div class="chart-title">${byYear ? '연도별' : '분기별'} 논문 수</div>
      <div class="legend"><span>발행일 기준</span></div>
      ${trendChart}
    </div>`;

  document.querySelectorAll('#dashBody .hbar').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.key;
      state.selTags.has(k) ? state.selTags.delete(k) : state.selTags.add(k);
      state.page = 1;
      renderDash(); renderTagBar(); renderList();
      $('#tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
}

/* ---------- 📖 바로읽기 → Claude /paper ---------- */
function paperPrompt(p) {
  const url = p.pdfUrl || p.landingUrl;
  return `/paper ${url}\n(제목: ${p.title})`;
}
const IS_ANDROID = /Android/i.test(navigator.userAgent);
function webPaperLink(p) {
  return `https://claude.ai/new?q=${encodeURIComponent(paperPrompt(p))}`;
}
function useAppLink() { return IS_ANDROID && state.settings.readInApp; }
/* 안드로이드: Claude 앱을 여는 intent 링크 (앱이 없으면 자동으로 웹 주소로 이동) */
function paperLink(p) {
  if (!useAppLink()) return webPaperLink(p);
  const q = encodeURIComponent(paperPrompt(p));
  return `intent://claude.ai/new?q=${q}#Intent;scheme=claude;package=com.anthropic.claude;`
       + `S.browser_fallback_url=${encodeURIComponent(webPaperLink(p))};end`;
}

/* ---------- 키워드 칩 ---------- */
function renderChips() {
  const box = $('#chips');
  if (state.settings.keywords.length === 0) {
    box.innerHTML = '<span class="meta">키워드를 1개 이상 추가해 주세요</span>';
    return;
  }
  box.innerHTML = state.settings.keywords.map((k, i) =>
    `<span class="chip" translate="no">${esc(k)}<button data-i="${i}" aria-label="삭제">✕</button></span>`
  ).join('');
  box.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      state.settings.keywords.splice(Number(b.dataset.i), 1);
      saveSettings();
      renderChips();
    };
  });
}
function addKeyword() {
  const input = $('#kwInput');
  const v = input.value.trim();
  if (!v) return;
  if (!state.settings.keywords.some(k => k.toLowerCase() === v.toLowerCase())) {
    state.settings.keywords.push(v);
    saveSettings();
    renderChips();
  }
  input.value = '';
  input.focus();
}

/* ---------- 기간 / 정렬 / 필터 ---------- */
function renderPeriod() {
  const s = state.settings;
  const y = new Date().getFullYear();
  $('#period').value = s.period;
  $('#customBox').style.display = s.period === 'custom' ? 'inline' : 'none';
  $('#fromYear').value = s.fromYear || y - 2;
  $('#toYear').value = s.toYear || y;
}
function renderSort() {

    b.classList.toggle('on', b.dataset.sort === state.settings.sort)
  );

/* ---------- 데이터 거르기 ---------- */
function sourceList(tabId) {
  if (tabId === 'all') return state.all;
  if (tabId === 'ss') return state.ss;
  if (tabId === 'sd') return state.sd;
  if (tabId === 'fav') return favPapers();
  return [];
}
function upwFiltered(list) {
  return state.settings.upwOnly ? list.filter(p => p.upw) : list;
}
function tagFiltered(list) {
  if (state.selTags.size === 0) return list;
  return list.filter(p => p.tags.some(t => state.selTags.has(t)));
}
function visiblePapers() {
  const list = tagFiltered(upwFiltered(sourceList(state.tab)));
  const sorted = [...list];
  if (state.tab === 'fav' && state.settings.sort === 'date') {
    // 즐겨찾기는 최신순 = 최근에 별표한 순
    sorted.sort((a, b) => String(b.addedAt).localeCompare(String(a.addedAt)));
  } else if (state.settings.sort === 'cite') sorted.sort((a, b) => (b.citations || 0) - (a.citations || 0));
  else sorted.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return sorted;
}
function totalPages() { return Math.max(1, Math.ceil(visiblePapers().length / PAGE_SIZE)); }
function pageSlice() {
  const start = (state.page - 1) * PAGE_SIZE;
  return visiblePapers().slice(start, start + PAGE_SIZE);
}

function renderTabs() {

  ).join('');
  document.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { state.tab = b.dataset.tab; state.page = 1; renderAll(); };
  });

  $('#upwHint').textContent = state.settings.upwOnly
    ? (hidden ? `관련성 낮은 ${hidden}건 숨김` : '')

}

function renderTagBar() {

}

/* ---------- 논문 카드 ---------- */
function tagMeta(key) { return TAG_INDEX.find(t => t.key === key); }

function cardHTML(p) {
  const srcLabel = p.sources.map(s => s === 'ss'
    ? '<span class="src ss">Semantic Scholar</span>'
    : '<span class="src sd">ScienceDirect</span>').join('')
    + (p.sources.length > 1 ? '<span class="src both">🔁 양쪽 수록</span>' : '');
  // 원문 버튼: PDF 직접 다운로드 대신 논문 출처 페이지(DOI → 출판사 페이지)로 이동
  const openUrl = p.landingUrl || p.pdfUrl;
  const mode = state.tr.mode;
  const trOff = mode === 'on' && !state.settings.trEnabled;   // 사용자가 번역을 끈 상태
  const ko = trOff ? '' : state.tr.cache[p.title];

  /* 제목: B(자동 번역) 모드면 한국어, 아니면 영어(브라우저 번역 대상) */
  let titleMain, pending = false;
  if (mode === 'on' || mode === 'downloading' || mode === 'needClick') {
    if (ko) titleMain = ko;
    else { titleMain = p.title; pending = mode === 'on' && !trOff; }
  } else {
    titleMain = ko || p.title;
  }
  const showOrig = ko || mode === 'fallback';
  const fav = isFav(p);
  const memo = (state.favs[paperKey(p)] || {}).memo || '';
  const memoOpen = state.memoOpen.has(paperKey(p));

  const tags = p.tags.map(k => {
    const t = tagMeta(k);
    return t ? `<span class="tag ${t.cls}">#${esc(t.name)}</span>` : '';
  }).join('');

  return `
  <article class="card ${p.isNew ? 'is-new' : ''} ${!p.upw ? 'low' : ''}" data-key="${esc(paperKey(p))}">
    <div class="card-top">
      ${p.isNew ? '<span class="badge-new">NEW</span>' : ''}
      <h3 lang="${ko ? 'ko' : 'en'}" data-pid="${esc(p.id)}" class="${pending ? 'pending' : ''}">${esc(titleMain)}</h3>
      <span class="date" translate="no">${esc(p.date)}</span>
      <button class="star ${fav ? 'on' : ''}" data-act="fav" title="${fav ? '즐겨찾기 해제' : '즐겨찾기 추가'}" aria-label="즐겨찾기">${fav ? '★' : '☆'}</button>
    </div>
    ${showOrig ? `<p class="orig-title" translate="no" lang="en">${esc(p.title)}</p>` : ''}
    ${!p.upw ? '<span class="low-label">UPW 관련성 낮음</span>' : ''}
    <div class="meta" translate="no">${srcLabel}${esc(p.authors)} · ${esc(p.venue)} · 인용 ${p.citations}</div>
    <p class="abstract" translate="no" lang="en">${esc(p.abstract || '초록 정보 없음')}</p>
    <div class="abs-tools">
      ${p.abstract ? '<button class="more">더보기 ▾</button>' : ''}
    </div>
    ${tags ? `<div class="tags" translate="no">${tags}</div>` : ''}
    ${memo && !memoOpen ? `<div class="memo-view" translate="no">📝 ${esc(memo)}</div>` : ''}
    <div class="memo-edit ${memoOpen ? 'open' : ''}">
      <textarea data-act="memoText" placeholder="이 논문을 나중에 기억할 수 있게 짧게 메모하세요 (예: 2차 RO 붕소 개선안 참고)">${esc(memo)}</textarea>
      <div class="row">
        <button class="btn" data-act="memoCancel">취소</button>
        <button class="btn primary" data-act="memoSave">저장</button>
      </div>
    </div>
    <div class="actions">
      ${openUrl
        ? `<a class="btn primary" data-act="read" href="${esc(paperLink(p))}" ${useAppLink() ? '' : 'target="_blank" rel="noopener"'} title="Claude 새 채팅에 /paper ${p.pdfUrl ? 'PDF' : 'DOI'} 링크가 입력된 상태로 열립니다">📖 바로읽기 (/paper)</a>`
        : '<button class="btn primary" disabled>📖 바로읽기 (링크 없음)</button>'}
      ${openUrl
        ? `<a class="btn" data-act="open" href="${esc(openUrl)}" target="_blank" rel="noopener">${p.landingUrl ? '🔗 논문 페이지 열기' : '📄 원문 PDF 열기'}</a>`
        : '<button class="btn" disabled>원문 링크 없음</button>'}
      <button class="btn" data-act="memo">📝 ${memo ? '메모 수정' : '메모'}</button>
    </div>
  </article>`;
}

/* ---------- 목록 + 페이지 ---------- */
function renderList() {
  const box = $('#list');
  if (state.loading) return;
  $('#favbar').classList.toggle('show', state.tab === 'fav');
  const all = visiblePapers();
  if (state.page > totalPages()) state.page = totalPages();
  const items = pageSlice();

  if (items.length === 0) {
    let msg = '[🔍 검색]을 눌러 논문을 불러오세요.';
    if (state.tab === 'fav') {
      msg = state.favQuery ? '검색어에 맞는 즐겨찾기가 없습니다.'
          : state.selTags.size ? '선택한 태그에 해당하는 즐겨찾기가 없습니다.'
          : '아직 즐겨찾기한 논문이 없습니다. 카드 오른쪽 위의 ☆를 눌러 추가하세요.';
    } else if (state.searched) {
      msg = state.selTags.size ? '선택한 태그에 해당하는 논문이 없습니다.'
          : state.settings.upwOnly && sourceList(state.tab).length ? 'UPW 관련 논문이 없습니다. "UPW 관련 논문만 보기"를 꺼 보세요.'
          : '조건에 맞는 논문이 없습니다. 키워드나 기간을 바꿔 보세요.';
    }
    box.innerHTML = `<div class="empty">${msg}</div>`;
  } else {
    box.innerHTML = items.map(cardHTML).join('');
  }

  box.querySelectorAll('.more').forEach(btn => {
    btn.onclick = () => {
      const ab = btn.closest('.card').querySelector('.abstract');
      const open = ab.classList.toggle('open');
      btn.textContent = open ? '접기 ▴' : '더보기 ▾';
    };
  });

  bindCardEvents(box);
  renderPager(all.length);
  const newCnt = upwFiltered(state.all).filter(p => p.isNew).length;
  $('#newTotal').textContent = `🔴 NEW ${newCnt}`;
  $('#readAll').style.display = newCnt ? '' : 'none';
  translateVisible();
}

/* 카드 안 버튼들 (별, 메모, 원문 열기) */
function findPaper(key) {
  return [...state.all, ...state.ss, ...state.sd].find(p => paperKey(p) === key)
      || favPapers().find(p => paperKey(p) === key)
      || (state.favs[key] && state.favs[key].paper);
}
function bindCardEvents(box) {
  box.querySelectorAll('.card').forEach(card => {
    const key = card.dataset.key;
    card.querySelectorAll('[data-act]').forEach(el => {
      const act = el.dataset.act;
      if (act === 'fav') el.onclick = () => {
        const p = findPaper(key); if (!p) return;
        toggleFav(p);
        renderTabs(); renderList();
      };
      if (act === 'memo') el.onclick = () => {
        state.memoOpen.add(key); renderList();
        const ta = document.querySelector(`.card[data-key="${CSS.escape(key)}"] textarea`);
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      };
      if (act === 'memoCancel') el.onclick = () => { state.memoOpen.delete(key); renderList(); };
      if (act === 'memoSave') el.onclick = () => {
        const p = findPaper(key); if (!p) return;
        const text = card.querySelector('textarea').value;
        if (text.trim()) saveMemo(p, text);
        else if (state.favs[key]) { state.favs[key].memo = ''; saveJson(FAV_KEY, state.favs); }
        state.memoOpen.delete(key);
        renderTabs(); renderList();
      };
      if (act === 'read') el.addEventListener('click', () => {
        // 혹시 입력창이 비어 있을 때를 대비해 같은 내용을 클립보드에도 복사
        const p = findPaper(key);
        if (p && navigator.clipboard) navigator.clipboard.writeText(paperPrompt(p)).catch(() => {});
        if (state.seen && !state.seen[key]) { markSeen([key]); setTimeout(renderList, 300); }
        $('#status').innerHTML = useAppLink()
          ? '📱 Claude 앱을 여는 중입니다. 입력창이 비어 있으면 <b>붙여넣기</b> 하세요. (/paper 링크를 복사해 두었습니다.)'
          : '📖 Claude가 새 탭에서 열렸습니다. 입력창의 <b>/paper 링크</b>를 확인하고 전송하세요. (입력창이 비어 있으면 붙여넣기 하세요. 이미 복사해 두었습니다.)';
      });
      if (act === 'open') el.addEventListener('click', () => {
        // 원문을 열면 그 논문의 NEW 표시를 지움 (새 탭이 열린 뒤 화면 갱신)
        if (state.seen && !state.seen[key]) { markSeen([key]); setTimeout(renderList, 300); }
      });
    });
  });
}

function renderPager(total) {
  const pages = totalPages();
  const cur = state.page;
  const pager = $('#pager');
  if (total <= PAGE_SIZE) {
    pager.innerHTML = '';
    $('#pagerInfo').textContent = total ? `총 ${total}건` : '';
    return;
  }
  /* 표시할 페이지 번호: 1, 현재±2, 마지막 */
  const nums = new Set([1, pages]);
  for (let i = cur - 2; i <= cur + 2; i++) if (i >= 1 && i <= pages) nums.add(i);
  const sorted = [...nums].sort((a, b) => a - b);
  let html = `<button data-go="${cur - 1}" ${cur === 1 ? 'disabled' : ''}>◀</button>`;
  let prev = 0;
  sorted.forEach(n => {
    if (n - prev > 1) html += '<span class="dots">…</span>';
    html += `<button data-go="${n}" class="${n === cur ? 'on' : ''}">${n}</button>`;
    prev = n;
  });
  html += `<button data-go="${cur + 1}" ${cur === pages ? 'disabled' : ''}>▶</button>`;
  pager.innerHTML = html;
  pager.querySelectorAll('button[data-go]').forEach(b => {
    b.onclick = () => {
      state.page = Number(b.dataset.go);
      renderList();
      $('#tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
  const start = (cur - 1) * PAGE_SIZE + 1;
  $('#pagerInfo').textContent = `총 ${total}건 중 ${start}–${Math.min(cur * PAGE_SIZE, total)}번째 · ${cur}/${pages} 페이지`;
}

document.querySelectorAll('#sortSeg button').forEach(b => {

    state.settings.sort = b.dataset.sort;
    state.page = 1;

    renderList();

});

  $('#appSwitch').style.display = '';

  $('#readInApp').onchange = (e) => { state.settings.readInApp = e.target.checked; saveSettings(); renderList(); };
}

$('#tagToggle').onclick = () => { state.settings.tagbarOpen = !state.settings.tagbarOpen; saveSettings(); renderTagBar(); };

$('#searchBtn').onclick = runSearch;

$('#readAll').onclick = () => {

};

let favSearchTimer;

  clearTimeout(favSearchTimer);
  favSearchTimer = setTimeout(() => { state.favQuery = e.target.value; state.page = 1; renderList(); }, 200);
});
$('#backupExport').onclick = exportBackup;

$('#backupFile').onchange = (e) => {
  if (e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
};

/* ---------- 시작 ---------- */
renderChips();
renderPeriod();
renderSort();
renderAll();
initTranslator();
runSearch();
</script>
